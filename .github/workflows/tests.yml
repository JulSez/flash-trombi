name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py launcher.py paths.py pdf_import.py practice_mode.py progress_view.py storage.py updates.py version.py
      - run: python -m unittest discover -s tests -v
