name: Apply v0.6.4 UI patch

on:
  push:
    branches:
      - fix/v0.6.4-learning-and-session-balance

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v064-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.4-learning-and-session-balance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch app.py
        run: python scripts/apply_v064_ui.py
      - name: Commit patched app.py
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No UI patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Apply v0.6.4 UI changes [v064-ui-applied]"
          git push origin HEAD:fix/v0.6.4-learning-and-session-balance
