name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Smoke-test OCR import
        shell: pwsh
        run: |
          python -c "from rapidocr import RapidOCR; print('RapidOCR OK')"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "name=Flash Trombi v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: release_check
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name FlashTrombi --add-data "app.py;." --collect-all streamlit --collect-all altair --collect-all rapidocr --collect-all onnxruntime launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\FlashTrombi.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashTrombi-Windows
          path: installer-output/FlashTrombi-Setup.exe

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.release_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: installer-output/FlashTrombi-Setup.exe
          generate_release_notes: true
