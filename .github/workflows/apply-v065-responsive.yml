name: Apply v0.6.5 responsive UI

on:
  push:
    branches:
      - fix/v0.6.5-same-day-miss-resets-cycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v065-responsive-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.5-same-day-miss-resets-cycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch responsive UI
        run: python scripts/apply_v065_responsive.py
      - name: Commit responsive UI
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No responsive patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Apply v0.6.5 responsive UI [v065-responsive-applied]"
          git push origin HEAD:fix/v0.6.5-same-day-miss-resets-cycle
